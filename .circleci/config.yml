version: 2.1

orbs:
  node: circleci/node@5

jobs:

  install:
    executor:
      name: node/default
      tag: "22.14"
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  test:
    executor:
      name: node/default
      tag: "22.14"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run Tests
          command: npm test -- --watchAll=false --passWithNoTests

  security-scan:
    executor:
      name: node/default
      tag: "22.14"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Dependency Vulnerability Scan
          command: npm audit --audit-level=high || true

  sonar-scan:
    docker:
      - image: sonarsource/sonar-scanner-cli:latest
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: SonarQube Analysis
          command: |
            sonar-scanner \
              -Dsonar.organization=joshreecesolomon-del \
              -Dsonar.projectKey=payment-portal \
              -Dsonar.sources=src \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=98be945d390e0c8629a4f646227411ede053f1f9

  build:
    executor:
      name: node/default
      tag: "22.14"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build React App
          command: npm run build
      - store_artifacts:
          path: build
          destination: build-output

workflows:
  devsecops-pipeline:
    jobs:
      - install
      - test:
          requires:
            - install
      - security-scan:
          requires:
            - install
      - sonar-scan:
          requires:
            - test
      - build:
          requires:
            - test
            - security-scan
